        // Global DOM elements

        const filterTag = document.getElementById('filterTag');
        const filterSpeaker = document.getElementById('filterSpeaker');

        const statSpeakers = document.getElementById('stat-speakers');

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            populateSpeakerDropdown();
            applyFilters();
        });

        // Populate Speaker Dropdown
        function populateSpeakerDropdown() {
            const speakers = [...new Set(coursesData.map(c => c.speaker))].sort();
            speakers.forEach(spk => {
                const opt = document.createElement('option');
                opt.value = spk;
                opt.textContent = spk;
                filterSpeaker.appendChild(opt);
            });
        }

        // Render Cards
        function renderCourses(items) {
            courseGrid.innerHTML = '';

            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                statCount.textContent = '0';
                return;
            }

            emptyState.classList.add('hidden');
            statCount.textContent = items.length;

            const uniqueSpeakersInFiltered = new Set(items.map(i => i.speaker));
            statSpeakers.textContent = uniqueSpeakersInFiltered.size;

                                ${isAI ? '<span class="bg-sky-100 text-sky-800 font-semibold text-[10px] px-2 py-0.5 rounded border border-sky-200"><i class="fa-solid fa-robot me-1"></i>AI</span>' : ''}

                            <!-- Speaker Name -->
                            <div class="text-sm font-bold text-brand-600 mb-1 flex items-center gap-1.5">
                                <i class="fa-solid fa-user-doctor text-xs"></i>
                                <span>${item.speaker}</span>
                            </div>

                            <!-- Topic Title -->
                            <h3 class="text-base font-bold text-slate-900 group-hover:text-brand-600 transition-colors line-clamp-2 leading-snug mb-3" title="${item.topic}">
                                ${item.topic}
                            </h3>

                            <!-- Preview Text (Background) -->
                            <p class="text-xs text-slate-600 line-clamp-3 mb-4 bg-slate-50 p-2.5 rounded-lg border border-slate-100">

                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">

                                <i class="fa-solid fa-chevron-right text-[10px]"></i>

                            <button onclick="copySingleCourse(${item.id})" title="複製此單篇資訊" class="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition">

                courseGrid.appendChild(card);

        // Filter Logic
        function applyFilters() {
            const searchVal = searchInput.value.toLowerCase().trim();
            const dateVal = filterDate.value;
            const roomVal = filterRoom.value;
            const tagVal = filterTag.value;
            const speakerVal = filterSpeaker.value;

            const filtered = coursesData.filter(item => {
                // Search match
                const matchSearch = !searchVal || 
                    item.speaker.toLowerCase().includes(searchVal) ||
                    item.topic.toLowerCase().includes(searchVal) ||
                    item.background.toLowerCase().includes(searchVal) ||
                    item.reason.toLowerCase().includes(searchVal) ||
                    item.feature.toLowerCase().includes(searchVal) ||
                    item.room.toLowerCase().includes(searchVal);

                // Date match
                const matchDate = !dateVal || item.date === dateVal;

                // Room match
                const matchRoom = !roomVal || item.room.includes(roomVal);

                // Tag match
                const matchTag = !tagVal || (
                    (tagVal === 'Keynote' && (item.tags.includes('Keynote') || item.room.includes('Keynote') || item.topic.includes('Keynote'))) ||
                    (tagVal === 'AI' && (item.tags.includes('AI') || item.topic.includes('AI') || item.topic.includes('人工智能'))) ||
                    (tagVal === '專業品質／法規／伦理' && item.room.includes('專業品質')) ||
                    (tagVal === 'International' && (item.room.includes('201') || item.tags.includes('International'))) ||
                    (tagVal === '教育論壇' && item.topic.includes('教育'))
                );

                // Speaker match
                const matchSpeaker = !speakerVal || item.speaker === speakerVal;

                return matchSearch && matchDate && matchRoom && matchTag && matchSpeaker;
            });

            renderCourses(filtered);
        }

        // Reset Filter
        function resetFilters() {
            searchInput.value = '';
            filterDate.value = '';
            filterRoom.value = '';
            filterTag.value = '';
            filterSpeaker.value = '';
            applyFilters();
        }

        // Open Modal Details
        function openModal(id) {
            const item = coursesData.find(c => c.id === id);
            if (!item) return;

            document.getElementById('modalDateTag').textContent = item.date;
            document.getElementById('modalRoomTag').textContent = item.room;
            document.getElementById('modalSpeaker').textContent = item.speaker;
            document.getElementById('modalTopic').textContent = item.topic;
            document.getElementById('modalBackground').textContent = item.background;
            document.getElementById('modalReason').textContent = item.reason;
            document.getElementById('modalFeature').textContent = item.feature;

            const copyBtn = document.getElementById('modalCopyBtn');
            copyBtn.onclick = () => copySingleCourse(item.id);

            document.getElementById('detailModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Close Modal
        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Copy Single Course Info
        function copySingleCourse(id) {
            const item = coursesData.find(c => c.id === id);
            if (!item) return;

            const textToCopy = `【${item.date}｜${item.room}】\n講師：${item.speaker}\n講題：${item.topic}\n\n專業背景：\n${item.background}\n\n推薦理由：\n${item.reason}\n\n預期演講特色：\n${item.feature}`;

            copyToClipboard(textToCopy, `已複製 ${item.speaker} 的課程推薦資訊！`);
        }

        // Copy Entire Web Code (Full HTML String)
        function copyFullHtml() {
            const fullCode = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            copyToClipboard(fullCode, "已將完整網頁 HTML 程式碼複製至剪貼簿！可以貼上至您的網站使用。");
        }

        // Universal Clipboard Helper
        function copyToClipboard(text, successMsg) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMsg);
                }).catch(() => {
                    fallbackCopy(text, successMsg);
                });
            } else {
                fallbackCopy(text, successMsg);
            }
        }

        function fallbackCopy(text, successMsg) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(successMsg);
            } catch (err) {
                showToast("複製失敗，請手動全選複製");
            }
            document.body.removeChild(textArea);
        }

        // Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        // Close modal on click outside
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
